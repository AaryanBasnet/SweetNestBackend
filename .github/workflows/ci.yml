name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run already in flight - no point
# burning minutes on a commit that has been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      # `npm ci`, not `npm install`: it installs exactly what the lockfile
      # says and fails if package.json and the lockfile disagree. CI should
      # never quietly resolve a different dependency tree than a developer has.
      - run: npm ci

      - run: npm run lint

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x]

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Tells globalSetup to use this service container instead of downloading
      # and starting an in-memory mongod - faster, and no binary download.
      MONGO_TEST_URI: mongodb://localhost:27017/sweetnest-test
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: matrix.node == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      # Fails the build on a high or critical advisory. This is a real gate:
      # the repository is currently clean, so anything it reports is new.
      - run: npm audit --audit-level=high
