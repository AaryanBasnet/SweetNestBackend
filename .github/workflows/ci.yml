name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run already in flight - no point
# burning minutes on a commit that has been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      # `npm ci`, not `npm install`: it installs exactly what the lockfile
      # says and fails if package.json and the lockfile disagree. CI should
      # never quietly resolve a different dependency tree than a developer has.
      - run: npm ci

      - run: npm run lint

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x]

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Tells globalSetup to use this service container instead of downloading
      # and starting an in-memory mongod - faster, and no binary download.
      MONGO_TEST_URI: mongodb://localhost:27017/sweetnest-test
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: matrix.node == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest

    # Job level, not step level.
    #
    # docker-compose.yml marks JWT_SECRET as a required variable, and Compose
    # resolves it before doing anything else. It reads the value from either
    # the shell environment or a .env file. .env is gitignored, so on a runner
    # the environment is the only source.
    #
    # Scoping this to the smoke-test step alone left "Show logs on failure" and
    # "Tear down" without it - and "Tear down" runs if: always(), so it failed
    # on every run and turned the job red even when the smoke test passed.
    # ESEWA_SECRET_KEY is here for a different reason. The container runs with
    # NODE_ENV=production, and esewaController refuses to load in production
    # without real gateway credentials - a deliberate guard, so a misconfigured
    # deploy cannot serve traffic with a payment gateway it cannot sign for.
    # The smoke test only proves the stack boots and talks to MongoDB, so a
    # placeholder is correct here; it never reaches eSewa.
    env:
      JWT_SECRET: ci-smoke-test-secret-not-used-anywhere-real
      ESEWA_MERCHANT_ID: EPAYTEST
      ESEWA_SECRET_KEY: ci-smoke-test-esewa-key-not-used-anywhere-real

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Builds the image but pushes nowhere. A Dockerfile that no longer
      # builds is something to learn about on a pull request, not halfway
      # through a deploy.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: sweetnest-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Brings up the real compose stack, which exercises the compose file as
      # well as the image: service networking, the healthcheck, and the
      # depends_on condition that makes the API wait for Mongo.
      - name: Smoke test the compose stack
        run: |
          set -euo pipefail

          # Fail here with a readable message rather than inside Compose's
          # interpolation error, which is harder to diagnose.
          test -n "$JWT_SECRET"

          # Resolves the compose file without starting anything, so an
          # interpolation or syntax problem surfaces before containers are
          # involved.
          docker compose config >/dev/null

          docker compose up -d --wait --wait-timeout 120

          docker compose ps

          curl -fsS http://127.0.0.1:5000/health \
            | tee /dev/stderr \
            | grep -q '"status":"ok"'

          curl -fsS http://127.0.0.1:5000/ready \
            | tee /dev/stderr \
            | grep -q '"database":"connected"'

          echo 'API is up and talking to MongoDB.'

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      # Fails the build on a high or critical advisory. This is a real gate:
      # the repository is currently clean, so anything it reports is new.
      - run: npm audit --audit-level=high
