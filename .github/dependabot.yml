# Dependabot opens a pull request when something we depend on has a newer version.
# The pull request runs CI, so a bad update is caught before it is merged.
version: 2
updates:
  # The base images in the Dockerfile (node, and so on). This is how a Node security
  # release reaches the image without anyone having to remember it.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # The base images in docker-compose files (mongo)
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  # The versions of the actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # npm packages. Grouped so a week of small updates arrives as one pull request.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
