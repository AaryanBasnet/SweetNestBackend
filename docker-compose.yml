# =============================================================================
# SweetNest API + MongoDB - the production-style setup
#
#   docker compose up --build                 build the image here and run it
#   docker compose pull && docker compose up  use the image CI published instead
#
# Related files:
#   docker-compose.dev.yml        add on top for development (hot reload)
#   docker-compose.fullstack.yml  the whole app: database, API and website
#
# Brings up the database and the API together, with no local MongoDB install
# required. "Clone the repo and run one command" is the bar a project should
# meet - a README with twelve setup steps is where contributors give up.
# =============================================================================

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # No "ports:" here on purpose. The API reaches the database over the private
    # compose network by the name "mongo", so nothing on your machine's network
    # can connect to it. The development file publishes 27017 so you can use
    # Compass or mongosh while developing.
    volumes:
      # Named volume, so data survives `docker compose down`. It does NOT
      # survive `docker compose down -v`, which is how you get a clean slate.
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    # Both "build" and "image": "up --build" builds this folder and tags the result
    # with this name; "pull" downloads the image CI published under the same name.
    image: ghcr.io/aaryanbasnet/sweetnest-api:${API_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-local}
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      # "mongo" is the service name above. Compose runs a DNS server on the
      # shared network, so containers reach each other by service name.
      # localhost inside a container means that container, not the host.
      DB_URL: mongodb://mongo:27017/SweetNestDatabase
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - copy .env.example to .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      RESET_CODE_SECRET: ${RESET_CODE_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:5000}
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-}
      ESEWA_MERCHANT_ID: ${ESEWA_MERCHANT_ID:-EPAYTEST}
      ESEWA_SECRET_KEY: ${ESEWA_SECRET_KEY:-}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_APP_PASSWORD: ${EMAIL_APP_PASSWORD:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      mongo:
        # Waits for mongo's healthcheck to pass, not merely for the container
        # to exist. Without this the API starts first, finds no database, and
        # the fail-fast startup check exits.
        condition: service_healthy

volumes:
  mongo-data:
