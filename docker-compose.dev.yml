# =============================================================================
# Development overrides. Use together with the main file:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build --watch
#
# Compose merges the second file over the first, so this file only lists what
# changes for development:
#
#   - the "dev" image stage (dev dependencies, "node --watch")
#   - "develop.watch": every file you save is copied into the running container,
#     where "node --watch" notices it and restarts the server (no rebuild)
#   - MongoDB published on localhost:27017 for Compass or mongosh
#
# Why "watch" and not the classic "volumes: ./:/app" (a bind mount)?
# On Windows and macOS, Docker runs inside a small Linux VM and reads a bind-mounted
# folder through a file-sharing layer. Node loads hundreds of small files at start-up,
# and each one crosses that layer. I measured this project: loading the app took 43
# seconds through a bind mount from the D: drive, against 0.9 seconds from inside the
# image. "watch" keeps the files inside the container (fast) and only copies changes.
# =============================================================================

services:
  mongo:
    ports:
      - "27017:27017"

  api:
    build:
      target: dev
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    command: ["npm", "run", "dev"]
    develop:
      watch:
        # Save a source file: copy it in, node --watch restarts the server.
        - action: sync
          path: ./
          target: /app
          ignore:
            - node_modules/
            - .git/
            - coverage/
            - tests/
        # Change the dependencies: rebuild the image, because the modules were
        # installed when it was built.
        - action: rebuild
          path: package.json
        - action: rebuild
          path: package-lock.json
